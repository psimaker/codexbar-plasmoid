name: Documentation screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/screenshots.yml'
      - '.github/workflows/plasma-smoke.yml'
      - 'tests/screenshots/**'
      - 'tests/test_screenshots.py'
      - 'tests/smoke/**'
      - 'contents/**'
      - 'metadata.json'
      - 'docs/screenshots/**'
      - 'README.md'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: archlinux:base-devel
    steps:
      - name: Install Plasma and capture tools
        run: >-
          pacman -Syu --noconfirm
          git plasma-sdk plasma-desktop libplasma plasma5support kirigami kcmutils ksvg
          breeze breeze-icons plasma-integration noto-fonts xorg-server-xvfb xorg-xwininfo imagemagick xdotool
          python libfaketime

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render documentation candidates
        run: dbus-run-session -- bash tests/screenshots/render.sh "$PWD/dist/screenshots"

      - name: Upload candidates and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-screenshots-${{ github.sha }}
          path: dist/screenshots/
          if-no-files-found: error
